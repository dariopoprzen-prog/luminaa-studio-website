<main>
  <h1 class="center-title">Contact</h1>
  <p class="lead center">Questions about Luminaa or interested in working together? Write to us directly using the form.</p>

  <form id="formular" class="card" action="https://formsubmit.co/cam@luminaastudio.com" method="POST">
    <input type="hidden" name="_subject" value="New inquiry via luminaastudio.com">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://luminaastudio.com/danke.html">
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

    <label>Name
      <input type="text" name="Name" required>
    </label>
    <label>Email
      <input type="email" name="E-Mail" required>
    </label>
    <label>Message
      <textarea name="Nachricht" rows="5" required></textarea>
    </label>
    <button type="submit" class="btn">Send Message</button>
  </form>

  <div class="card center" style="margin-top:18px">
    <p>Or reach us directly by email: <a href="mailto:cam@luminaastudio.com" style="color:var(--gold)">cam@luminaastudio.com</a></p>
  </div>
</main>
